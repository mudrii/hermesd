[build-system]
# >=1.32 emits current Core Metadata 2.5; Twine 7 validates it.
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "hermesd"
version = "2026.7.11"
description = "TUI monitoring dashboard for Hermes AI agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Nous Research"},
    {name = "Ion Mudreac", email = "mudreac@gmail.com"},
]
keywords = ["hermes", "agent", "dashboard", "tui", "monitoring", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "rich>=14.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    # Security floor pins for the dev toolchain itself (not runtime deps):
    # pip is audited by pip-audit; msgpack is a transitive of cachecontrol.
    "pip>=26.2",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "msgpack>=1.2.1",
    "types-PyYAML>=6.0.0",
    "pip-audit>=2.10.1",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mudrii/hermesd"
Repository = "https://github.com/mudrii/hermesd"
Issues = "https://github.com/mudrii/hermesd/issues"
Changelog = "https://github.com/mudrii/hermesd/blob/main/CHANGELOG.md"

[project.scripts]
hermesd = "hermesd.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["hermesd"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "return NotImplemented",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 96

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "N",
    "RUF",
]
ignore = [
    "E501",
    "RET504",
    "SIM108",
    "B008",
    "B904",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "hermesd.db"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.hatch.build.targets.sdist]
include = [
    "hermesd/",
    "tests/",
    ".github/",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "Dockerfile",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "flake.nix",
]

[tool.hatch.build.targets.wheel]
packages = ["hermesd"]
