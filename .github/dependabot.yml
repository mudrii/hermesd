version: 2
updates:
  # Routine minor/patch action bumps arrive as one grouped PR; major version
  # bumps stay separate PRs so each gets individual review (audit CI-08).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  # hermesd maintains its own locked dependency baseline (uv.lock) and pushes
  # every bump through the full CI gate. Weekly PRs keep that maintenance
  # deliberate and reviewable; Dependabot security alerts and dependency
  # security updates (repository settings) are unaffected by this cadence.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
