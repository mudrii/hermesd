name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.10"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy hermesd
      - name: Compile check
        run: uv run python -m compileall hermesd
      - name: Test
        run: uv run pytest tests/ -v -W error::ResourceWarning --cov=hermesd --cov-report=term-missing
      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.10"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Test on macOS
        run: uv run pytest tests/ -v -W error::ResourceWarning --cov=hermesd --cov-report=term-missing

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          version: "0.12.10"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Build package
        run: uv build
      - name: Smoke test built wheel
        run: |
          uv run python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/hermesd --version
          .wheel-smoke/bin/python -I -m hermesd --version
          uv run python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install dist/*.tar.gz
          .sdist-smoke/bin/hermesd --version
          .sdist-smoke/bin/python -I -m hermesd --version
      - name: Check package metadata
        run: uv run twine check dist/*

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build --tag hermesd-ci .
      - name: Smoke test Docker image
        run: docker run --rm hermesd-ci --version

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check commit-pinned Nix flake
        run: nix flake check --no-write-lock-file
