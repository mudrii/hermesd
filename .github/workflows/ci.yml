name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.28"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy hermesd
      - name: Compile check
        run: uv run python -m compileall hermesd
      - name: Test
        run: uv run pytest tests/ -v -W error::ResourceWarning
      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit
      - name: Build package
        run: uv build
      - name: Smoke test built wheel
        run: |
          uv run python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/hermesd --version
          .wheel-smoke/bin/python -m hermesd --version
          uv run python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install dist/*.tar.gz
          .sdist-smoke/bin/hermesd --version
          .sdist-smoke/bin/python -m hermesd --version
      - name: Check package metadata
        run: uv run twine check dist/*
