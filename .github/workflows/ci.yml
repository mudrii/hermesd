name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: "3.11"
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy hermesd
      - name: Compile check
        run: uv run python -m compileall hermesd

  security:
    name: Dependency audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: uv run python -m compileall hermesd
      - name: Test
        run: uv run pytest tests/ -v -W error::ResourceWarning --cov=hermesd --cov-report=term-missing

  macos:
    name: Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: "3.14"
      - name: Test on macOS
        run: uv run pytest tests/ -v -W error::ResourceWarning --cov=hermesd --cov-report=term-missing

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: "3.11"
      - name: Build package
        run: uv build
      - name: Verify wheel dependency pins match the lockfile
        run: uv run python scripts/check_wheel_pins.py
      - name: Smoke test built wheel
        run: |
          uv run python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/hermesd --version
          .wheel-smoke/bin/python -I -m hermesd --version
          uv run python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install dist/*.tar.gz
          .sdist-smoke/bin/hermesd --version
          .sdist-smoke/bin/python -I -m hermesd --version
      - name: Check package metadata
        run: uv run twine check dist/*

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build --tag hermesd-ci .
      - name: Smoke test Docker image
        run: docker run --rm hermesd-ci --version
      - name: Smoke test Docker checkpoint support
        run: |
          docker run --rm -i --network none --entrypoint python hermesd-ci - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from hermesd.collect.system import _git_checkpoint_summary

          with tempfile.TemporaryDirectory() as directory:
              repo = Path(directory)
              subprocess.run(["git", "init", "--quiet", str(repo)], check=True)
              for number in range(2):
                  subprocess.run([
                      "git", "-C", str(repo), "-c", "user.name=Smoke Test",
                      "-c", "user.email=smoke@example.invalid", "commit", "--quiet",
                      "--allow-empty", "-m", f"checkpoint {number}",
                  ], check=True)
              count, timestamp, reason = _git_checkpoint_summary(repo / ".git")
              assert count == 2 and timestamp is not None and reason == "checkpoint 1"
          PY

  nix:
    name: Nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check commit-pinned Nix flake (builds package, tests, and smoke checks)
        run: nix flake check --no-write-lock-file
      - name: Build hermesd package (runs the pytest suite)
        run: nix build .#hermesd
      - name: Smoke test installed executable
        run: ./result/bin/hermesd --version
