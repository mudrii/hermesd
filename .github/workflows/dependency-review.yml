name: Dependency review

# Dedicated PR gate for dependency changes (audit CI-13). Complements the
# scheduled scans: this catches a *change* that introduces a vulnerable or
# prohibited dependency before merge; the weekly Security workflow catches
# advisories published against unchanged pins.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          # Blocking policy: introducing a dependency with a known
          # vulnerability at moderate severity or higher fails the PR.
          fail-on-severity: moderate
          # A missing dependency snapshot is retried and reported, never
          # silently treated as a pass.
          retry-on-snapshot-warnings: true
          # Summary stays in the run (no PR comment): posting comments would
          # require pull-requests: write for no control benefit.
