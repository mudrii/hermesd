name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Release eligibility (audit CI-04): agreeing tag/version/changelog is not
  # enough. The exact commit the tag points to must carry a successful,
  # completed run of the aggregate CI gate; anything else - missing, failed,
  # cancelled, stale, or still-running validation - refuses to publish.
  release-eligibility:
    name: Release eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify the release commit passed the required CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          REQUIRED_CHECK: CI gate
        run: |
          gh api "repos/${{ github.repository }}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[]' > "$RUNNER_TEMP/check-runs.jsonl"
          python3 - <<'PY'
          import json
          import os
          import sys

          required = os.environ["REQUIRED_CHECK"]
          latest: dict[str, dict] = {}
          with open(os.environ["RUNNER_TEMP"] + "/check-runs.jsonl") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  run = json.loads(line)
                  current = latest.get(run["name"])
                  if current is None or run["id"] > current["id"]:
                      latest[run["name"]] = run

          gate = latest.get(required)
          if gate is None:
              sys.exit(
                  f"no '{required}' check run exists on the release commit "
                  f"{os.environ['RELEASE_SHA']} - refusing to publish"
              )
          if gate["status"] != "completed":
              sys.exit(
                  f"'{required}' on the release commit is still '{gate['status']}' "
                  "- refusing to publish"
              )
          if gate["conclusion"] != "success":
              sys.exit(
                  f"'{required}' on the release commit concluded "
                  f"'{gate['conclusion']}' - refusing to publish"
              )
          print(
              f"release commit {os.environ['RELEASE_SHA']} "
              f"passed the '{required}' aggregate gate"
          )
          PY

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-env
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "true"
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy hermesd
      - name: Compile check
        run: uv run python -m compileall hermesd
      - name: Test
        run: uv run pytest tests/ -q -ra --tb=short -W error::ResourceWarning --cov=hermesd --cov-report=term-missing --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-test-diagnostics-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest-results.xml
            .coverage
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies (pip-audit, classified gate)
        run: uv run python scripts/pip_audit_gate.py

  release-build:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.release.prerelease }}
    timeout-minutes: 15
    needs: [test, release-eligibility]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release builds keep uv caching disabled (audit CI-16): publication
      # inputs must not acquire a cache trust dependency.
      - uses: ./.github/actions/locked-env
        with:
          python-version: "3.11"
          enable-cache: "false"
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(f"release tag {release_tag!r} does not match {expected_tag!r}")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing release section [{version}]")
          PY
      - name: Build release distributions
        run: uv build
      - name: Verify wheel dependency pins match the lockfile
        run: uv run python scripts/check_wheel_pins.py
      - name: Verify release distributions
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = {
              Path(f"dist/hermesd-{version}.tar.gz"),
              Path(f"dist/hermesd-{version}-py3-none-any.whl"),
          }
          actual = {
              path
              for path in Path("dist").iterdir()
              if path.is_file() and not path.name.startswith(".")
          }
          if actual != expected:
              expected_list = ", ".join(sorted(str(path) for path in expected))
              actual_list = ", ".join(sorted(str(path) for path in actual))
              raise SystemExit(f"unexpected release distributions: {actual_list}; expected {expected_list}")
          PY
      - name: Smoke test built wheel
        # Smoke venvs live outside the checkout so local and CI runs never
        # leave accidental repository artifacts behind (audit CI-21).
        run: |
          uv run python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/hermesd" --version
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -m hermesd --version
          "$RUNNER_TEMP/wheel-smoke/bin/python" scripts/installed_smoke.py
          uv run python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/hermesd" --version
          "$RUNNER_TEMP/sdist-smoke/bin/python" -I -m hermesd --version
          "$RUNNER_TEMP/sdist-smoke/bin/python" scripts/installed_smoke.py
      - name: Check package metadata
        run: uv run twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.release.prerelease }}
    timeout-minutes: 10
    needs: release-build
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/hermesd
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist/
      - name: Verify downloaded release distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          expected_sdist="dist/hermesd-${version}.tar.gz"
          expected_wheel="dist/hermesd-${version}-py3-none-any.whl"
          test -f "${expected_sdist}"
          test -f "${expected_wheel}"
          test "$(find dist -type f ! -name '.*' | wc -l | tr -d ' ')" = "2"
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
